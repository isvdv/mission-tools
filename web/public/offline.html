<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#15191f" />
    <title>Mission Tools offline</title>
    <style>
      :root {
        color-scheme: dark;
        --background: #15191f;
        --surface: #0d0d0d;
        --border: #35404e;
        --text-primary: #f2f2f2;
        --text-secondary: #a1a1a1;
        --text-muted: #666666;
        --accent: #9bbcff;
        --radius: 6px;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          linear-gradient(rgba(255, 255, 255, 0.026) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
          var(--background);
        background-size: 32px 32px, 32px 32px, auto;
        color: var(--text-primary);
        padding: 24px;
      }

      main {
        width: min(100%, 460px);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        padding: 28px;
      }

      .label {
        margin: 0 0 10px;
        color: var(--accent);
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 12px;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 24px;
        line-height: 1.2;
      }

      p {
        margin: 0;
        color: var(--text-secondary);
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="label">OFFLINE_MODE</p>
      <h1>CONNECTION_FAILED</h1>
      <p>Conecte novamente para acessar o painel, carregar os dados do Discord e executar acoes do bot.</p>
    </main>
  </body>
</html>
